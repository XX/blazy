[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/XX/blazy"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
bench-utils = { path = "crates/bench-utils" }
blazy = { path = "crates/blazy" }
blazy-canvas = { path = "crates/blazy-canvas" }
masonry = { git = "https://github.com/linebender/xilem.git", rev = "ce7b04d2ba2d9d7a8c364f2ab109e2083121e144", default-features = false }
masonry_winit = { git = "https://github.com/linebender/xilem.git", rev = "ce7b04d2ba2d9d7a8c364f2ab109e2083121e144" }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false }
