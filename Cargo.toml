[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/XX/blazy"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
bench-utils = { path = "crates/bench-utils" }
blazy = { path = "crates/blazy" }
blazy-app = { path = "crates/blazy-app" }
blazy-areas = { path = "crates/blazy-areas" }
blazy-canvas = { path = "crates/blazy-canvas" }
blazy-node-editor = { path = "crates/blazy-node-editor" }
blazy-ops = { path = "crates/blazy-ops" }
blazy-shape = { path = "crates/blazy-shape" }
blazy-widgets = { path = "crates/blazy-widgets" }
# `default-features = false` so a consumer can refuse the window system: the facade
# forwards `window` as a feature of its own, and guest mode (§14) wants none of it.
# Anything that does open a window asks for `window` explicitly, or has it from the facade's
# defaults, which is how the examples get it.
blazy-shell = { path = "crates/blazy-shell", default-features = false }
node-canvas = { path = "examples/node-canvas" }
# Our fork, not upstream: branch `dev` of `XX/xilem`, which is `linebender/xilem` at `271a27a`
# plus our own commits — so far one, the return flag on `Layer::capture_pointer_event`
# (architecture §17 item 4, §39.1). Pinned to a commit rather than to the branch, like every
# other move of this pin: an update is a deliberate step that CI judges, not a side effect.
masonry = { git = "https://github.com/XX/xilem.git", rev = "88250dc02f0e6b89cb2689d923b46ad5a742de26", default-features = false }
winit = "0.30"
softbuffer = "0.4"
tracing = "0.1"
ui-events-winit = "0.3"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false }
imaging_vello_cpu = "0.0.2"
# The GPU path. `wgpu` is pinned to the version `imaging_wgpu` selects by default: the
# texture types have to come from the same crate version, and a mismatch is not a build
# error in an obvious place but a type error inside someone else's interface (§27.1).
imaging_vello = "0.0.2"
imaging_wgpu = "0.0.2"
wgpu = "29"
strum = { version = "0.28", features = ["derive"] }
