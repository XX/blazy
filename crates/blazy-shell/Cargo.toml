[package]
name = "blazy-shell"
description = "The host: windows, input, composition, and the choice of rasteriser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# `harness = false` because the verdict is a set of counter thresholds, not a sampled
# timing distribution; the target's own docs say why neither libtest nor criterion fits.
[[bench]]
name = "shell"
path = "benches/shell/main.rs"
harness = false

[lib]
bench = false

[features]
default = ["window"]
# A second rasteriser, so the choice at startup is a choice rather than a formality.
# Off by default: it needs a graphics device, which a build machine may not have.
vello = ["dep:masonry_imaging", "masonry_imaging/imaging_vello"]
# Owner mode: our own window and event loop.
window = ["dep:winit", "dep:softbuffer", "dep:ui-events-winit"]

[dependencies]
masonry = { workspace = true }
imaging_vello_cpu = { workspace = true }
masonry_imaging = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
ui-events-winit = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
masonry = { workspace = true, features = ["testing"] }
bench-utils = { workspace = true }
clap = { workspace = true }
