[package]
name = "blazy"
description = "A Blender-style UI layer on top of Masonry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `window` is on by default, exactly as it is when depending on the shell directly;
# `vello` is the one an application has to ask for.
default = ["window"]
window = ["blazy-shell/window"]
vello = ["blazy-shell/vello"]
# Masonry's `TestHarness`, for an application's own tests. Through the facade because the
# harness has to come from the same Masonry as the widgets it drives, and the only way an
# application gets that one without repeating the git pin is from here.
testing = ["masonry/testing"]

[dependencies]
blazy-areas = { workspace = true }
blazy-canvas = { workspace = true }
blazy-node-editor = { workspace = true }
blazy-ops = { workspace = true }
blazy-shape = { workspace = true }
blazy-shell = { workspace = true }
masonry = { workspace = true }
