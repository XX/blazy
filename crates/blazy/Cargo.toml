[package]
name = "blazy"
description = "A Blender-style UI layer on top of Masonry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The shell's own features, forwarded in both directions. An application depends on
# `blazy`, so anything it cannot turn on here it cannot have at all — and anything it
# cannot turn *off* here it has to carry. The second half matters as much as the first:
# guest mode (§14) hands us somebody else's device and wants no window system at all,
# and a headless test wants the same, so `window` has to be refusable.
[features]
# `window` is on by default, exactly as it is when depending on the shell directly;
# `vello` is the one an application has to ask for.
default = ["window"]
window = ["blazy-shell/window"]
vello = ["blazy-shell/vello"]

[dependencies]
blazy-areas = { workspace = true }
blazy-canvas = { workspace = true }
blazy-ops = { workspace = true }
blazy-shape = { workspace = true }
blazy-shell = { workspace = true }
