[config]
default_to_workspace = false
additional_profiles = ["debug"]

[env]
RUST_BACKTRACE = 0


[tasks.choose-profile.env]
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"


[tasks.run-node-canvas]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "node-canvas", "--profile", "${PROFILE}", "--", "${@}"]
dependencies = ["choose-profile"]

[tasks.run-area-screen]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "area-screen", "--profile", "${PROFILE}", "--", "${@}"]
dependencies = ["choose-profile"]


[tasks.fmt-check]
command = "cargo"
toolchain = "nightly"
args = ["fmt", "--check"]

[tasks.fmt]
command = "cargo"
toolchain = "nightly"
args = ["fmt"]

[tasks.clippy]
command = "cargo"
toolchain = "stable"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
toolchain = "stable"
args = ["test", "--workspace"]

[tasks.lint]
dependencies = ["fmt-check", "clippy"]

[tasks.lint-test]
dependencies = ["lint", "test"]


# The `bench` profile inherits `release`, so no `--profile` juggling here: a debug
# build would measure the optimiser rather than the architecture, and cargo already
# knows that about bench targets.

[tasks.bench-canvas]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "${@}"]

[tasks.bench-canvas-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-canvas-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "--report", "${BENCH_REPORT}", "${@}"]

[tasks.bench-shell]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "blazy-shell", "--", "${@}"]

[tasks.bench-shell-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-shell-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "blazy-shell", "--", "--report", "${BENCH_REPORT}", "${@}"]

[tasks.bench-areas]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "${@}"]

[tasks.bench-areas-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-areas-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "--report", "${BENCH_REPORT}", "${@}"]

[tasks.bench]
clear = true
dependencies = ["bench-canvas", "bench-areas", "bench-shell"]

[tasks.bench-report]
dependencies = ["bench-canvas-report", "bench-areas-report", "bench-shell-report"]

# The fourth criterion of the shell task, and the one that is a fact about the
# dependency graph rather than about a frame: everything that knows about a window
# lives in `blazy-shell` (architecture §3). A criterion in a benchmark could not see
# this — by the time a benchmark runs, the tree is already linked.
[tasks.deps-rule]
description = "Core crates must not depend on a window system."
script_runner = "@shell"
script = '''
status=0
for crate in blazy-areas blazy-canvas blazy-shape; do
    found=$(cargo tree -e normal -p $crate 2>/dev/null | grep -Eo '^[^a-z]*(winit|wgpu|softbuffer|ui-events-winit) v[0-9.]+' | sort -u)
    if [ -n "$found" ]; then
        echo "$crate depends on a window system:"
        echo "$found"
        status=1
    fi
done
if [ $status -eq 0 ]; then
    echo "dependency rule holds: blazy-areas, blazy-canvas and blazy-shape know nothing about windows"
fi
exit $status
'''

[tasks.ci]
dependencies = ["lint", "test", "deps-rule", "bench-report"]
