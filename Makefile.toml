[config]
default_to_workspace = false
additional_profiles = ["debug"]

[env]
RUST_BACKTRACE = 0


[tasks.choose-profile.env]
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"


[tasks.run-node-canvas]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "node-canvas", "--profile", "${PROFILE}"]
dependencies = ["choose-profile"]

[tasks.run-area-screen]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "area-screen", "--profile", "${PROFILE}"]
dependencies = ["choose-profile"]


[tasks.fmt-check]
command = "cargo"
toolchain = "nightly"
args = ["fmt", "--check"]

[tasks.fmt]
command = "cargo"
toolchain = "nightly"
args = ["fmt"]

[tasks.clippy]
command = "cargo"
toolchain = "stable"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
toolchain = "stable"
args = ["test", "--workspace"]

[tasks.lint]
dependencies = ["fmt-check", "clippy"]

[tasks.lint-test]
dependencies = ["lint", "test"]


# The `bench` profile inherits `release`, so no `--profile` juggling here: a debug
# build would measure the optimiser rather than the architecture, and cargo already
# knows that about bench targets. Exits non-zero if a Phase 0 criterion fails — see
# crates/bench-utils/src/criteria.rs.
[tasks.bench]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "${@}"]

# What CI gates on. The full scenario set, because the whole run is under a second
# and the extra scenarios cost nothing while making the archived report worth diffing.
[tasks.bench-ci]
# Absolute, because cargo runs a bench target with the *package* as its working
# directory, not the workspace root — a relative path would land in
# examples/node-canvas/target/ and the CI artifact step would find nothing.
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "--report", "${BENCH_REPORT}"]

# Phase 0.5: the same gate for the area screen. Separate task rather than a flag on
# `bench`, because the two answer different questions and a failure should name which.
[tasks.bench-areas]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "${@}"]

[tasks.bench-areas-ci]
env = { AREAS_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/areas-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "--report", "${AREAS_REPORT}"]

[tasks.bench-all-ci]
dependencies = ["bench-ci", "bench-areas-ci"]

[tasks.ci]
dependencies = ["lint", "test", "bench-all-ci"]
