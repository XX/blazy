[config]
default_to_workspace = false
additional_profiles = ["debug"]

[env]
RUST_BACKTRACE = 0


[tasks.choose-profile.env]
PROFILE = "release"
PROFILE_BUILD_DIR = "${PROFILE}"

    [tasks.choose-profile.env.debug]
    PROFILE = "dev"
    PROFILE_BUILD_DIR = "debug"


[tasks.run-node-canvas]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "node-canvas", "--profile", "${PROFILE}", "--", "${@}"]
dependencies = ["choose-profile"]

[tasks.run-area-screen]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "area-screen", "--profile", "${PROFILE}", "--", "${@}"]
dependencies = ["choose-profile"]

[tasks.run-hello]
command = "cargo"
toolchain = "stable"
args = ["run", "-p", "hello", "--profile", "${PROFILE}", "--", "${@}"]
dependencies = ["choose-profile"]


[tasks.fmt-check]
command = "cargo"
toolchain = "nightly"
args = ["fmt", "--check"]

[tasks.fmt]
command = "cargo"
toolchain = "nightly"
args = ["fmt"]

[tasks.clippy]
command = "cargo"
toolchain = "stable"
args = ["clippy", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
toolchain = "stable"
args = ["test", "--workspace"]

[tasks.lint]
dependencies = ["fmt-check", "clippy"]

# The configurations the workspace build never compiles. Both examples ask for
# `window` and `vello`, and cargo unifies features across everything it builds at once,
# so `clippy --workspace` only ever sees the shell with both on — while the facade
# promises an application it can turn either off (§14, §40.4). Each package on its own
# is built with exactly the features named here, which is what makes these real checks.
[tasks.check-shell-bare]
command = "cargo"
toolchain = "stable"
args = ["clippy", "-p", "blazy-shell", "--no-default-features", "--all-targets", "--", "-D", "warnings"]

[tasks.check-shell-vello]
command = "cargo"
toolchain = "stable"
args = ["clippy", "-p", "blazy-shell", "--no-default-features", "--features", "vello", "--all-targets", "--", "-D", "warnings"]

[tasks.check-shell-window]
command = "cargo"
toolchain = "stable"
args = ["clippy", "-p", "blazy-shell", "--no-default-features", "--features", "window", "--all-targets", "--", "-D", "warnings"]

[tasks.check-facade-bare]
command = "cargo"
toolchain = "stable"
args = ["clippy", "-p", "blazy", "--no-default-features", "--all-targets", "--", "-D", "warnings"]

[tasks.check-features]
description = "Every feature combination an application can ask the facade for."
dependencies = ["check-shell-bare", "check-shell-vello", "check-shell-window", "check-facade-bare"]

# Rustdoc as a gate: six crates carry `missing_docs`, and a doc comment that links to
# nothing is as broken as one that is missing. Built with every feature on, because that
# is the configuration the documentation describes — without `window`, the links to the
# `window` module have nothing to point at, by construction rather than by mistake.
[tasks.doc]
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
toolchain = "stable"
args = ["doc", "--workspace", "--no-deps", "--all-features"]

[tasks.lint-test]
dependencies = ["lint", "test"]


# The `bench` profile inherits `release`, so no `--profile` juggling here: a debug
# build would measure the optimiser rather than the architecture, and cargo already
# knows that about bench targets.

[tasks.bench-canvas]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "${@}"]

[tasks.bench-canvas-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-canvas-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "node-canvas", "--", "--report", "${BENCH_REPORT}", "${@}"]

# `--features vello` so the GPU frame path is measured wherever the machine can run it.
# On a machine without a graphics device the scenario simply does not run and its
# criteria are absent, which is the honest answer rather than a failure (§27.5).
[tasks.bench-shell]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "blazy-shell", "--features", "vello", "--", "${@}"]

[tasks.bench-shell-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-shell-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "blazy-shell", "--features", "vello", "--", "--report", "${BENCH_REPORT}", "${@}"]

[tasks.bench-areas]
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "${@}"]

[tasks.bench-areas-report]
env = { BENCH_REPORT = "${CARGO_MAKE_WORKING_DIRECTORY}/target/bench-areas-report.json" }
command = "cargo"
toolchain = "stable"
args = ["bench", "-p", "area-screen", "--", "--report", "${BENCH_REPORT}", "${@}"]

[tasks.bench]
clear = true
dependencies = ["bench-canvas", "bench-areas", "bench-shell"]

[tasks.bench-report]
dependencies = ["bench-canvas-report", "bench-areas-report", "bench-shell-report"]

[tasks.ci]
dependencies = ["lint", "check-features", "doc", "test", "bench-report"]
